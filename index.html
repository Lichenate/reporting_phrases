<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report back on a topic you have read about</title><style>
:root{font-family:Arial,sans-serif;color:#191919;background:#fff8e5}*{box-sizing:border-box}
body{margin:0;background-color:#fff8e5;background-image:radial-gradient(circle,#18181822 1.6px,transparent 2.7px),radial-gradient(circle,#c32d2922 1.7px,transparent 2.9px);background-position:0 0,12px 14px;background-size:31px 29px,39px 37px}
header{position:relative;overflow:hidden;background:#151515;color:#ffda36;padding:38px max(20px,calc((100vw - 960px)/2)) 43px;border-bottom:10px solid #d32e27}
header:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;background-image:radial-gradient(circle at center,#ffdb38 0 2px,transparent 3px),radial-gradient(circle at center,transparent 0 18px,#e53b31 19px 21px,transparent 22px 32px,#f5c82b 33px 35px,transparent 36px 48px,#d92d27 49px 51px,transparent 52px),radial-gradient(circle at center,#edbc27 0 2px,transparent 3px);background-size:23px 23px,200px 200px,31px 29px;background-position:0 0,right -32px top -65px,9px 13px;mask-image:linear-gradient(90deg,transparent 0%,transparent 45%,black 100%)}
header:after{content:"";position:absolute;bottom:0;left:0;right:0;height:7px;background:repeating-radial-gradient(circle at 8px 3px,#f3d132 0 2px,transparent 3px 13px);background-size:22px 7px}
header h1{position:relative;max-width:850px;margin:0;font-size:clamp(1.65rem,3.5vw,2.25rem);line-height:1.25;letter-spacing:-.02em;text-shadow:0 1px 2px #000}
main{max-width:960px;margin:25px auto;padding:0 18px 50px}.panel{background:#fffdf5;border:2px solid #1b1b1b;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:5px 5px 0 #d22f28}h2{margin-top:0;color:#a7221e}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.cat{padding:14px;border-radius:9px;background:#ffed9b;border-left:7px dotted #111;font-weight:600}.cat:nth-child(2){border-left-color:#d42c25;background:#fff0c6}.cat:nth-child(3){border-left-color:#111;background:#f8d5b3}.cat:nth-child(4){border-left-color:#d42c25;background:#ffe394}.item{display:grid;grid-template-columns:1fr minmax(220px,38%);align-items:center;gap:14px;padding:13px 9px;border-bottom:1px dotted #a18a58;border-radius:6px}.item:last-child{border:0}.phrase{line-height:1.4}select{width:100%;font:inherit;padding:10px;border:1px solid #5b4a2d;border-radius:8px;background:#fffdf8;color:#171717}select:focus-visible,button:focus-visible{outline:3px solid #d72e27;outline-offset:2px}.correct{background:#e0efdd}.wrong{background:#fbdad6}.status{font-size:.9rem;margin-top:5px;color:#82231f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{padding:12px 18px;border:0;border-radius:9px;background:#b82520;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.09)}button.secondary{background:#f2ca38;color:#111;border:1px solid #111}#result{font-size:1.2rem;font-weight:700;color:#a7221e}#progress{font-weight:700;color:#242424}small{color:#555}@media(max-width:620px){.categories{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:6px}header{padding:28px 20px 32px}}
</style></head><body><header><h1>Report back on a topic you have read about</h1></header><main><section class="panel"><h2>Match each phrase to its purpose</h2><p>Read each expression and choose the purpose it serves when you tell classmates about something you've read.</p><div class="categories" id="categories"></div></section><section class="panel"><div id="progress" aria-live="polite">0 of 24 matched</div><div id="questions"></div><div class="actions"><button id="check">Check answers</button><button class="secondary" id="retry">Try again</button><button class="secondary" id="shuffle">Shuffle phrases</button></div><div id="result" aria-live="polite"></div></section></main><script>const groups={"Introducing the topic":["The topic I looked at was...","My reading focused on...","I found out about...","I'm going to tell you a bit about..."],"Reporting and adding information":["From what I read,...","Apparently,...","It turns out that...","One thing the article mentioned was...","On top of that,...","Another point worth mentioning is...","Something else I came across was...","As well as that,..."],"Highlighting details and giving a personal reaction":["What caught my attention was...","One thing that stood out to me was...","I had no idea that...","I was surprised to learn that...","Personally, I think...","It made me realise that...","It made me think about...","What struck me was..."],"Concluding":["So, that's basically what I learnt about...","To sum it up,...","The main thing I took away from this was...","Overall, what I found most interesting was..."]};const cats=Object.keys(groups),all=Object.entries(groups).flatMap(([cat,phrases])=>phrases.map(phrase=>({cat,phrase})));let order=[];const q=document.getElementById('questions');document.getElementById('categories').innerHTML=cats.map((c,i)=>`<div class="cat">${i+1}. ${c}</div>`).join('');function mix(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function render(shuffle=true){if(shuffle)order=mix(all);q.innerHTML='';order.forEach((o,i)=>{let div=document.createElement('div');div.className='item';let phrase=document.createElement('div');phrase.className='phrase';phrase.textContent=(i+1)+'. '+o.phrase;let right=document.createElement('div');let select=document.createElement('select');select.setAttribute('aria-label','Purpose for '+o.phrase);select.innerHTML='<option value="">Choose a purpose...</option>'+cats.map((c,j)=>`<option value="${j}">${c}</option>`).join('');select.addEventListener('change',()=>{div.classList.remove('correct','wrong');right.querySelector('.status').textContent='';update()});let status=document.createElement('div');status.className='status';right.append(select,status);div.append(phrase,right);q.append(div)});document.getElementById('result').textContent='';update()}function update(){document.getElementById('progress').textContent=`${[...q.querySelectorAll('select')].filter(s=>s.value!=='').length} of ${order.length} matched`}document.getElementById('check').onclick=()=>{let score=0;q.querySelectorAll('.item').forEach((div,i)=>{let s=div.querySelector('select'),st=div.querySelector('.status'),ok=cats[Number(s.value)]===order[i].cat&&s.value!=='';if(ok)score++;div.classList.toggle('correct',ok);div.classList.toggle('wrong',!ok);st.textContent=ok?'✓ Correct':'Correct answer: '+order[i].cat});document.getElementById('result').textContent=`Score: ${score} / ${order.length}`};document.getElementById('retry').onclick=()=>render(false);document.getElementById('shuffle').onclick=()=>render(true);render();</script></body></html>
